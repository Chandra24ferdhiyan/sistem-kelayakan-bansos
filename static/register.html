<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SPK Bansos Paranggupito</title>
    <meta name="description" content="Daftar akun baru untuk Sistem Pendukung Keputusan Bansos Kecamatan Paranggupito">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">

<div class="login-card text-center" style="max-width: 440px;">
    <div class="brand-icon mx-auto mb-3" style="width: 64px; height: 64px; font-size: 1.8rem;">
        <img src="/static/image/icon%202.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain; padding: 6px;">
    </div>
    <h3 class="fw-bold mb-1" style="color: #1e293b; letter-spacing: -0.02em;">Registrasi Akun</h3>
    <p class="text-muted mb-4" style="font-size: 0.82rem;">Sistem Pendukung Keputusan Bansos<br><span style="font-size: 0.72rem; color: #94a3b8;">Kecamatan Paranggupito</span></p>

    <div id="registerAlert" class="alert alert-danger d-none py-2" style="border-radius: 10px; font-size: 0.85rem;"></div>
    <div id="successAlert" class="alert alert-success d-none py-2" style="border-radius: 10px; font-size: 0.85rem;"></div>

    <form id="registerForm">
        <div class="mb-3 text-start">
            <label class="form-label" for="nama_lengkap">Nama Lengkap</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                <input type="text" id="nama_lengkap" class="form-control" required placeholder="Masukkan nama lengkap">
            </div>
        </div>
        <div class="mb-3 text-start">
            <label class="form-label" for="username">Username</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" id="username" class="form-control" required placeholder="Buat username" autocomplete="username">
            </div>
        </div>
        <div class="mb-2 text-start">
            <label class="form-label" for="password">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key"></i></span>
                <input type="password" id="password" class="form-control" required placeholder="Buat password (min 6 karakter)" minlength="6" autocomplete="new-password">
            </div>
        </div>
        <div class="mb-4 text-start">
            <label class="form-label" for="confirmPassword">Konfirmasi Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                <input type="password" id="confirmPassword" class="form-control" required placeholder="Ketik ulang password" autocomplete="new-password">
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2" id="btnRegister" style="font-size: 0.9rem;">
            <i class="bi bi-person-plus-fill me-2"></i>Daftar Sekarang
        </button>
        <div class="mt-4 text-center">
            <small class="text-muted">Sudah punya akun? <a href="/login" class="text-decoration-none fw-semibold" style="color: var(--primary-color); transition: color 0.2s;">Masuk di sini</a></small>
        </div>
    </form>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnRegister');
    const alertErr = document.getElementById('registerAlert');
    const alertSucc = document.getElementById('successAlert');
    
    alertErr.classList.add('d-none');
    alertSucc.classList.add('d-none');

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    
    if (password !== confirmPassword) {
        alertErr.classList.remove('d-none');
        alertErr.textContent = 'Password dan konfirmasi password tidak cocok.';
        return;
    }

    if (password.length < 6) {
        alertErr.classList.remove('d-none');
        alertErr.textContent = 'Password minimal 6 karakter.';
        return;
    }
    
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Loading...';
    btn.disabled = true;
    
    try {
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                nama_lengkap: document.getElementById('nama_lengkap').value.trim(),
                username: document.getElementById('username').value.trim(),
                password: password
            })
        });
        
        const data = await res.json();
        if(res.ok) {
            alertSucc.textContent = 'Registrasi berhasil! Mengalihkan ke login...';
            alertSucc.classList.remove('d-none');
            setTimeout(() => {
                window.location.href = '/login';
            }, 1500);
        } else {
            alertErr.classList.remove('d-none');
            alertErr.textContent = data.message;
            btn.innerHTML = '<i class="bi bi-person-plus-fill me-2"></i>Daftar Sekarang';
            btn.disabled = false;
        }
    } catch (err) {
        alertErr.classList.remove('d-none');
        alertErr.textContent = 'Gagal terhubung ke server.';
        btn.innerHTML = '<i class="bi bi-person-plus-fill me-2"></i>Daftar Sekarang';
        btn.disabled = false;
    }
});
</script>
</body>
</html>
