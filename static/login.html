<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SPK Bansos Paranggupito</title>
    <meta name="description" content="Login ke Sistem Pendukung Keputusan Klasifikasi Kelayakan Penerima Bansos Kecamatan Paranggupito">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">

<div class="login-card text-center">
    <div class="brand-icon mx-auto mb-3" style="width: 64px; height: 64px; font-size: 1.8rem;">
        <img src="/static/image/icon%202.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain; padding: 6px;">
    </div>
    <h3 class="fw-bold mb-1" style="color: #1e293b; letter-spacing: -0.02em;">Login Petugas</h3>
    <p class="text-muted mb-4" style="font-size: 0.82rem;">Sistem Pendukung Keputusan Bansos<br><span style="font-size: 0.72rem; color: #94a3b8;">Kecamatan Paranggupito</span></p>

    <div id="loginAlert" class="alert alert-danger d-none py-2 fs-6" style="border-radius: 10px; font-size: 0.85rem !important;"></div>

    <form id="loginForm">
        <div class="mb-3 text-start">
            <label class="form-label" for="username">Username</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" id="username" class="form-control" required placeholder="Masukkan username" autocomplete="username">
            </div>
        </div>
        <div class="mb-4 text-start">
            <label class="form-label" for="password">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-key"></i></span>
                <input type="password" id="password" class="form-control" required placeholder="Masukkan password" autocomplete="current-password">
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2" id="btnLogin" style="font-size: 0.9rem;">
            <i class="bi bi-box-arrow-in-right me-2"></i>Masuk Aplikasi
        </button>
        <div class="mt-4 text-center">
            <small class="text-muted">Belum punya akun? <a href="/register" class="text-decoration-none fw-semibold" style="color: var(--primary-color); transition: color 0.2s;">Daftar di sini</a></small>
        </div>
    </form>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    const alertEl = document.getElementById('loginAlert');
    
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Loading...';
    btn.disabled = true;
    alertEl.classList.add('d-none');
    
    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value
            })
        });
        
        const data = await res.json();
        if(res.ok) {
            window.location.href = '/dashboard';
        } else {
            alertEl.classList.remove('d-none');
            alertEl.textContent = data.message;
            btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Masuk Aplikasi';
            btn.disabled = false;
        }
    } catch (err) {
        alertEl.classList.remove('d-none');
        alertEl.textContent = 'Gagal terhubung ke server.';
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Masuk Aplikasi';
        btn.disabled = false;
    }
});
</script>
</body>
</html>
